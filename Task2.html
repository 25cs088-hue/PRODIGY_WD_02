<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stopwatch App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }

    .container {
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 350px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 20px;
    }

    #display {
      font-size: 48px;
      margin: 20px 0;
      letter-spacing: 2px;
    }

    .buttons button {
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .start {
      background: #28a745;
      color: white;
    }

    .pause {
      background: #ffc107;
      color: black;
    }

    .reset {
      background: #dc3545;
      color: white;
    }

    .lap {
      background: #17a2b8;
      color: white;
    }

    button:hover {
      opacity: 0.8;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    li {
      background: rgba(255,255,255,0.15);
      margin: 5px 0;
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <div class="buttons">
      <button class="start" onclick="startStopwatch()">Start</button>
      <button class="pause" onclick="pauseStopwatch()">Pause</button>
      <button class="reset" onclick="resetStopwatch()">Reset</button>
      <button class="lap" onclick="recordLap()">Lap</button>
    </div>

    <ul id="laps"></ul>
  </div>

  <script>
    let timer;
    let seconds = 0;
    let minutes = 0;
    let hours = 0;
    let running = false;

    function updateDisplay() {
      let h = hours < 10 ? "0" + hours : hours;
      let m = minutes < 10 ? "0" + minutes : minutes;
      let s = seconds < 10 ? "0" + seconds : seconds;

      document.getElementById("display").innerText = `${h}:${m}:${s}`;
    }

    function startStopwatch() {
      if (!running) {
        running = true;

        timer = setInterval(() => {
          seconds++;

          if (seconds === 60) {
            seconds = 0;
            minutes++;
          }

          if (minutes === 60) {
            minutes = 0;
            hours++;
          }

          updateDisplay();
        }, 1000);
      }
    }

    function pauseStopwatch() {
      running = false;
      clearInterval(timer);
    }

    function resetStopwatch() {
      running = false;
      clearInterval(timer);

      seconds = 0;
      minutes = 0;
      hours = 0;

      updateDisplay();

      document.getElementById("laps").innerHTML = "";
    }

    function recordLap() {
      if (running) {
        const lapTime = document.getElementById("display").innerText;

        const li = document.createElement("li");
        li.innerText = `Lap ${document.querySelectorAll('#laps li').length + 1}: ${lapTime}`;

        document.getElementById("laps").appendChild(li);
      }
    }
  </script>

</body>
</html>
